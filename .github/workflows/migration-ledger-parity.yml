# Catch out-of-band migration drift (apply_migration without a matching file,
# or a committed file never applied). Read-only: this does NOT apply SQL.
# Runs on every merge to main (no path filter) and on a daily cron.
name: Migration Ledger Parity

on:
  push:
    branches: [main]
  schedule:
    # Daily — drift between merges is the failure mode this exists to catch.
    # Off-peak minute, distinct from edge-functions-parity.yml (`17 13 * * *`).
    - cron: "41 13 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-migration-ledger-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: eigfvribtntbxyjutsma
    steps:
      - name: Require SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is not set. Create a CI-dedicated Supabase personal access token (do not reuse the laptop CLI token) and add it as the Actions secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Fixture self-test
        run: node scripts/migration-ledger-parity.mjs --self-test

      - name: Compare production ledger to supabase/migrations
        # Read-only GET /v1/projects/{ref}/database/migrations. Never applies.
        run: node scripts/migration-ledger-parity.mjs
