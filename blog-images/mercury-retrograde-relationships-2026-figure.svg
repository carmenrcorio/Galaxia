ect</text><rect x="60" y="250" width="350" height="160" rx="14" fill="#151233" fill-opacity="0.9" stroke="#d98a6a" stroke-opacity=".6" stroke-width="1.5"/><text x="82" y="302" font-family="DejaVu Serif, Georgia, serif" font-size="34" fill="#e3b06b" text-anchor="start" font-weight="normal">1</text><text x="82" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#efeaf7" text-anchor="start" font-weight="normal">Say the</text><text x="82" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#efeaf7" text-anchor="start" font-weight="normal">thing twice</text><rect x="435" y="250" width="350" height="160" rx="14" fill="#151233" fill-opacity="0.9" stroke="#6fb7c9" stroke-opacity=".6" stroke-width="1.5"/><text x="457" y="302" font-family="DejaVu Serif, Georgia, serif" font-size="34" fill="#e3b06b" text-anchor="start" font-weight="normal">2</text><text x="457" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#efeaf7" text-anchor="start" font-weight="normal">Ask before</text><text x="457" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#efeaf7" text-anchor="start" font-weight="normal">assuming intent</text><rect x="810" y="250" width="350" height="160" rx="14" fill="#151233" fill-opacity="0.9" stroke="#9d97c9" stroke-opacity=".6" stroke-width="1.5"/><text x="832" y="302" font-family="DejaVu Serif, Georgia, serif" font-size="34" fill="#e3b06b" text-anchor="start" font-weight="normal">3</text><text x="832" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#efeaf7" text-anchor="start" font-weight="normal">Draft it, wait,</text><text x="832" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#efeaf7" text-anchor="start" font-weight="normal">then send</text><rect x="60" y="450" width="350" height="160" rx="14" fill="#151233" fill-opacity="0.9" stroke="#e3b06b" stroke-opacity=".6" stroke-width="1.5"/><text x="82" y="502" font-family="DejaVu S