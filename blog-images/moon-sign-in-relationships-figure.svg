 Arial, sans-serif" font-size="22" fill="#efeaf7" text-anchor="start" font-weight="normal">Closeness, reassurance, time to recover</text><text x="600" y="685" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#8f8ab8" text-anchor="middle" font-weight="normal">Tendencies, not rules. The rest of the chart shapes each Moon.</text></svg>