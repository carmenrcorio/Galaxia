ab8" text-anchor="middle" font-weight="normal">as they are</text><text x="430" y="645" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#6fb7c9" text-anchor="middle" font-weight="normal">The picture you hold</text><rect x="690" y="220" width="420" height="360" rx="14" fill="#151233" fill-opacity="0.9" stroke="#9d97c9" stroke-opacity=".6" stroke-width="1.5"/><text x="720" y="270" font-family="DejaVu Serif, Georgia, serif" font-size="24" fill="#efeaf7" text-anchor="start" font-weight="normal">Two ways to read the gap</text><text x="720" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#e3b06b" text-anchor="start" font-weight="normal">Softer: warmth, compassion,</text><text x="720" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#e3b06b" text-anchor="start" font-weight="normal">generosity toward them</text><text x="720" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#d98a6a" text-anchor="start" font-weight="normal">Harder: idealization, unseen</text><text x="720" y="442" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#d98a6a" text-anchor="start" font-weight="normal">flaws, mixed signals</text><text x="720" y="520" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#8f8ab8" text-anchor="start" font-weight="normal">Test: can you name their flaws</text><text x="720" y="546" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#8f8ab8" text-anchor="start" font-weight="normal">specifically, without softening?</text></svg>