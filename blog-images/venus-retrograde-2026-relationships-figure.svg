 y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#efeaf7" text-anchor="end" font-weight="normal">Nov 13: turns direct</text><text x="90" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#d98a6a" text-anchor="start" font-weight="normal">Begins in Scorpio</text><text x="1110" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#e3b06b" text-anchor="end" font-weight="normal">Ends in Libra</text><text x="600" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#8f8ab8" text-anchor="middle" font-weight="normal">moves back into Libra</text><rect x="90" y="400" width="330" height="190" rx="14" fill="#151233" fill-opacity="0.9" stroke="#d98a6a" stroke-opacity=".6" stroke-width="1.5"/><text x="112" y="450" font-family="DejaVu Serif, Georgia, serif" font-size="24" fill="#d98a6a" text-anchor="start" font-weight="normal">Weeks 1-2</text><text x="112" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#efeaf7" text-anchor="start" font-weight="normal">Notice what is</text><text x="112" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#efeaf7" text-anchor="start" font-weight="normal">going unspoken</text><rect x="435" y="400" width="330" height="190" rx="14" fill="#151233" fill-opacity="0.9" stroke="#9d97c9" stroke-opacity=".6" stroke-width="1.5"/><text x="457" y="450" font-family="DejaVu Serif, Georgia, serif" font-size="24" fill="#9d97c9" text-anchor="start" font-weight="normal">Weeks 3-5</text><text x="457" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#efeaf7" text-anchor="start" font-weight="normal">Look at fairness:</text><text x="457" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#efeaf7" text-anchor="start" font-weight="normal">who does what</text><rect x="780" y="400" width="330" height="190" rx="14" fill="#151233" fill-opacity="0.9" stroke="#e3b06b" stroke-opacity=".6" stroke-width="1.5"/><text x="802" y="450" font-family="DejaVu Serif, Georgia, serif" font-size="24" fill="#e3b06b" text-anchor="start" font-weight="normal">Final week</text><text x="802" y="495" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#efeaf7" text-anchor="start" font-weight="normal">Bring one adjustment</text><text x="802" y="522" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#efeaf7" text-anchor="start" font-weight="normal">to your partner</text><text x="600" y="650" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#8f8ab8" text-anchor="middle" font-weight="normal">Reviewing is good. Deciding in haste is not.</text></svg>